[target]
fov = 20
F = 3.0
effl = 60.0
wavelength = [486, 589, 656]

[ga]
population = 8
topk = 4
generation = 100

[[optimizer]]
type = "sa"
step = 200
T0 = 10.0
T1 = 0.01

[[optimizer]]
type = "adam"
step = 200
scheduler = "cosine"
grad_norm = 10.0
lr = {}

[loss]
effl = 1.0
spot = 1.0


# --- surface 0: source ---
[[component]]
type = "source"
pupil = { method = "uniform", region = "rect", count = [128, 1] }
field = { method = "uniform", region = "rect", count = [3, 1] }
wavel = { method = "uniform", region = "line", count = 3 }

# --- surface 1: gap (fixed) ---
[[component]]
type = "gap"
thickness = { method = "raw", value = 0.0 }

# --- surface 2: refractor (trained) ---
[[component]]
type = "refractor"
shape = "sphere"
solver = { allow_negative = true }
diameter = { method = "raw", value = 20.0 }
curvature = { method = "normal", mean = 0.0, std = 5e-3 }
material = { method = "random", db = "sellmeier" }
train = { curvature = true }
mutate = { curvature = 0.001, material = 0.1 }
bounds = { curvature = [-0.1, 0.1] }

# --- surface 3: gap (trained) ---
[[component]]
type = "gap"
thickness = { method = "normal", mean = 5.0, std = 1.0 }
train = { thickness = true }
mutate = { thickness = 0.1 }
bounds = { thickness = [1.0, 10.0] }

# --- surface 4: refractor (fixed, air) ---
[[component]]
type = "refractor"
shape = "sphere"
diameter = { method = "raw", value = 20.0 }
curvature = { method = "normal", mean = 0.0, std = 5e-3 }
material = { method = "raw", value = "air", db = "constant" }
train = { curvature = true }
mutate = { curvature = 0.001, material = 0.1 }
bounds = { curvature = [-0.1, 0.1] }

# --- surface 5: gap (trained) ---
[[component]]
type = "gap"
thickness = { method = "normal", mean = 5.0, std = 1.0 }
train = { thickness = true }
mutate = { thickness = 0.1 }
bounds = { thickness = [1.0, 10.0] }

# --- surface 6: refractor (trained) ---
[[component]]
type = "refractor"
shape = "sphere"
diameter = { method = "raw", value = 20.0 }
curvature = { method = "normal", mean = 0.0, std = 5e-3 }
material = { method = "random", db = "sellmeier" }
train = { curvature = true }
mutate = { curvature = 0.001, material = 0.1 }
bounds = { curvature = [-0.1, 0.1] }

# --- surface 7: gap (trained) ---
[[component]]
type = "gap"
thickness = { method = "normal", mean = 5.0, std = 1.0 }
train = { thickness = true }
mutate = { thickness = 0.1 }
bounds = { thickness = [1.0, 10.0] }

# --- surface 8: refractor (fixed, air) ---
[[component]]
type = "refractor"
shape = "sphere"
diameter = { method = "raw", value = 20.0 }
curvature = { method = "normal", mean = 0.0, std = 5e-3 }
material = { method = "raw", value = "air", db = "constant" }
train = { curvature = true }
mutate = { curvature = 0.001, material = 0.1 }
