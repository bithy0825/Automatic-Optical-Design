<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光学系统可视化</title>
<style>
  :root {
    --ink: #1a1d21; --ink-2: #5b6470; --line: #d9dee4; --surface: #ffffff;
    --wash: #f4f6f8; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
         color: var(--ink); background: var(--wash); }
  header { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
           padding: 10px 14px; background: var(--surface);
           border-bottom: 1px solid var(--line); position: sticky; top: 0; }
  .file-btn { padding: 6px 14px; border: 1px solid var(--accent); color: var(--accent);
              border-radius: 6px; cursor: pointer; font-weight: 600; }
  .file-btn:hover { background: #eff4fe; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; padding: 6px 14px; background: var(--surface);
                color: var(--ink-2); cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  label { color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  input[type=number], select { padding: 4px 6px; border: 1px solid var(--line);
                               border-radius: 5px; font: inherit; }
  input[type=number] { width: 64px; }
  #status { color: var(--ink-2); margin-left: auto; }
  #meta { padding: 8px 14px; color: var(--ink-2); font-size: 13px;
          display: flex; gap: 18px; flex-wrap: wrap; }
  #meta b { color: var(--ink); font-weight: 600; }
  main { padding: 12px 14px; }
  .hint { color: var(--ink-2); text-align: center; padding: 80px 0; }
  .card { background: var(--surface); border: 1px solid var(--line);
          border-radius: 8px; padding: 10px; }
  svg { display: block; width: 100%; height: auto; }
  #spot-grid { display: flex; gap: 12px; flex-wrap: wrap; }
  #spot-grid .card { flex: 1 1 260px; min-width: 260px; }
  .panel-title { font-size: 12.5px; color: var(--ink-2); margin-bottom: 4px; }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2);
            padding: 6px 2px 0; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
              margin-right: 5px; vertical-align: -1px; }
</style>
</head>
<body>
<header>
  <label class="file-btn">打开 .toml / .pth
    <input id="file" type="file" accept=".toml,.pth" hidden></label>
  <div class="seg">
    <button id="btn-layout" class="on">光路图</button>
    <button id="btn-spot">点列图</button>
  </div>
  <label>个体 <input id="pop" type="number" min="0" value="0"></label>
  <label id="rays-wrap">光线数 <input id="rays" type="number" min="2" max="101" value="21"></label>
  <label id="density-wrap" hidden>密度 <input id="density" type="number" min="2" max="64" value="16"></label>
  <label id="sampling-wrap" hidden>采样
    <select id="sampling"><option>uniform</option><option>fibonacci</option></select></label>
  <span id="status"></span>
</header>
<section id="meta"></section>
<main id="canvas"><div class="hint">打开一个 .toml 或 .pth 文件开始</div></main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const SVGNS = "http://www.w3.org/2000/svg";
const state = { view: "layout", loaded: false };

// 波长 (nm) → 近似 RGB（380–700 经验映射；光学的领域惯例：红光画红）
function waveRGB(nm) {
  let r = 0, g = 0, b = 0;
  if (nm < 440)      { r = (440 - nm) / 60; b = 1; }
  else if (nm < 490) { g = (nm - 440) / 50; b = 1; }
  else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
  else if (nm < 580) { r = (nm - 510) / 70; g = 1; }
  else if (nm < 645) { r = 1; g = (645 - nm) / 65; }
  else               { r = 1; }
  return `rgb(${(r * 220) | 0},${(g * 200) | 0},${(b * 235) | 0})`;
}
const fmt = (x, d = 3) => Number(x).toPrecision(d);

function el(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

async function api(url, options) {
  const resp = await fetch(url, options);
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || resp.statusText);
  return data;
}

async function loadFile(file) {
  $("status").textContent = `载入 ${file.name} …`;
  try {
    const m = await api(`/api/load?name=${encodeURIComponent(file.name)}`,
                        { method: "POST", body: file });
    state.loaded = true;
    state.meta = m;
    $("pop").max = m.population - 1;
    $("pop").value = 0;
    renderMeta(m);
    show();
  } catch (e) {
    $("status").textContent = `错误：${e.message}`;
  }
}

function renderMeta(m) {
  const pop = +$("pop").value || 0;
  const parts = [
    `<span><b>${m.name}</b></span>`,
    `<span>种群 <b>${m.population}</b></span>`,
    `<span>EPD <b>${fmt(m.epd)}mm</b></span>`,
    `<span>总长 <b>${fmt(m.total_length[pop])}mm</b></span>`,
    `<span>视场 <b>${m.fields_deg.map(f => `(${fmt(f[0])}°, ${fmt(f[1])}°)`).join(" ")}</b></span>`,
    `<span>波长 <b>${m.wavelengths_nm.join(" / ")}nm</b></span>`,
    `<span>面 <b>${m.surfaces.map(s => s.label).join(" · ")}</b></span>`,
  ];
  if (m.target) parts.push(`<span>目标 <b>${m.target.id}</b>（F=${fmt(m.target.F)}，EFFL=${fmt(m.target.effl)}mm）</span>`);
  if (m.losses) parts.push(`<span>损失 <b>${fmt(m.losses.total[pop])}</b></span>`);
  $("meta").innerHTML = parts.join("");
}

function show() {
  if (!state.loaded) return;
  $("btn-layout").classList.toggle("on", state.view === "layout");
  $("btn-spot").classList.toggle("on", state.view === "spot");
  $("rays-wrap").hidden = state.view !== "layout";
  $("density-wrap").hidden = $("sampling-wrap").hidden = state.view !== "spot";
  if (state.meta) renderMeta(state.meta);  // pop 可能已变，元信息行跟随
  if (state.view === "layout") showLayout(); else showSpot();
}

// ── 光路图（x-z 截面：z 向右，x 向上） ──
async function showLayout() {
  $("status").textContent = "追迹中…";
  const q = `pop=${+$("pop").value || 0}&rays=${+$("rays").value || 21}`;
  const data = await api(`/api/layout?${q}`);
  const { meta, profiles, rims, paths, holds } = data;

  let zmin = Infinity, zmax = -Infinity, xmax = 1e-9;
  const eat = (p) => { if (!p) return;
    zmin = Math.min(zmin, p[1]); zmax = Math.max(zmax, p[1]); xmax = Math.max(xmax, Math.abs(p[0])); };
  profiles.forEach((prof) => prof.forEach(eat));
  paths.forEach((f) => f.forEach((w) => w.forEach((ray) => ray.forEach(eat))));
  const zpad = (zmax - zmin) * 0.04, xpad = Math.max(xmax * 1.25, 0.5);
  const zspan = zmax - zmin, lw = zspan * 0.0025;
  const svg = el("svg", { viewBox: `${zmin - zpad} ${-xpad} ${zspan + 2 * zpad} ${2 * xpad}` });
  const pt = (p) => `${p[1]},${-p[0]}`;  // (x,z) → SVG(z, -x)：z 向右、x 向上

  svg.appendChild(el("line", { x1: zmin - zpad, y1: 0, x2: zmax + zpad, y2: 0,
    stroke: "#d9dee4", "stroke-width": lw, "stroke-dasharray": `${4 * lw} ${4 * lw}` }));

  profiles.forEach((prof, s) => {  // 面 profile（域外 null 处断线）
    let seg = [];
    const flush = () => {
      if (seg.length > 1) svg.appendChild(el("polyline", {
        points: seg.join(" "), fill: "none", stroke: "#1a1d21",
        "stroke-width": 1.6 * lw, "stroke-linejoin": "round" }));
      seg = [];
    };
    prof.forEach((p) => { p ? seg.push(pt(p)) : flush(); });
    flush();
    for (const r of rims[s]) if (r) svg.appendChild(el("circle", {
      cx: r[1], cy: -r[0], r: 1.8 * lw,
      fill: meta.kinds[s] === "stop" ? "#b45309" : "#1a1d21" }));
  });

  paths.forEach((f, fi) => f.forEach((w, wi) => w.forEach((ray, n) => {
    const dead = holds[fi][wi][n].at(-1) === 0;
    svg.appendChild(el("polyline", {
      points: ray.filter(Boolean).map(pt).join(" "), fill: "none",
      stroke: waveRGB(meta.wavelengths_nm[wi]),
      "stroke-width": (n === 0 ? 1.1 : 0.6) * lw,
      opacity: dead ? 0.25 : 0.85, "stroke-linejoin": "round" }));
  })));

  const card = document.createElement("div"); card.className = "card";
  card.appendChild(svg);
  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML =
    meta.wavelengths_nm.map((w) => `<span><i style="background:${waveRGB(w)}"></i>${w}nm</span>`).join("") +
    `<span>面：${meta.labels.join(" · ")}</span><span>EFFL ≈ ${fmt(meta.effl)}mm</span>`;
  card.appendChild(legend);
  $("canvas").replaceChildren(card);
  $("status").textContent = "";
}

// ── 点列图（逐视场小图，波长着色的散点，共享量程） ──
async function showSpot() {
  $("status").textContent = "追迹中…";
  const q = `pop=${+$("pop").value || 0}&density=${+$("density").value || 16}&sampling=${$("sampling").value}`;
  const { meta, spots, holds } = await api(`/api/spot?${q}`);
  const F = spots.length, W = spots[0].length;

  let ext = 1e-9;  // 全视场共享量程（活点），便于横向比较
  for (let fi = 0; fi < F; fi++) for (let wi = 0; wi < W; wi++)
    for (let n = 0; n < spots[fi][wi].length; n++) {
      const p = spots[fi][wi][n];
      if (p && holds[fi][wi][n]) ext = Math.max(ext, Math.abs(p[0]), Math.abs(p[1]));
    }
  ext *= 1.15;

  const grid = document.createElement("div"); grid.id = "spot-grid";
  for (let fi = 0; fi < F; fi++) {
    const chief = spots[fi][0][0];
    let alive = 0, r2 = 0;  // 活点绕主光线的 RMS 半径
    for (let wi = 0; wi < W; wi++) for (let n = 1; n < spots[fi][wi].length; n++) {
      const p = spots[fi][wi][n];
      if (!p || !holds[fi][wi][n]) continue;
      alive++; r2 += (p[0] - chief[0]) ** 2 + (p[1] - chief[1]) ** 2;
    }
    const [fx, fy] = meta.fields_deg[fi];
    const svg = el("svg", { viewBox: `${-ext} ${-ext} ${2 * ext} ${2 * ext}` });
    const lw = ext * 0.004;
    svg.appendChild(el("rect", { x: -ext, y: -ext, width: 2 * ext, height: 2 * ext,
      fill: "none", stroke: "#d9dee4", "stroke-width": lw }));
    svg.appendChild(el("line", { x1: -ext, y1: 0, x2: ext, y2: 0, stroke: "#eef1f4", "stroke-width": lw * 0.75 }));
    svg.appendChild(el("line", { x1: 0, y1: -ext, x2: 0, y2: ext, stroke: "#eef1f4", "stroke-width": lw * 0.75 }));
    for (let wi = 0; wi < W; wi++) for (let n = 1; n < spots[fi][wi].length; n++) {
      const p = spots[fi][wi][n];
      if (!p || !holds[fi][wi][n]) continue;
      svg.appendChild(el("circle", { cx: p[0], cy: -p[1], r: ext * 0.006,
        fill: waveRGB(meta.wavelengths_nm[wi]), opacity: 0.55 }));
    }
    if (chief) svg.appendChild(el("circle", { cx: chief[0], cy: -chief[1], r: ext * 0.012,
      fill: "none", stroke: "#1a1d21", "stroke-width": lw }));

    const title = document.createElement("div"); title.className = "panel-title";
    title.textContent = `视场 (${fmt(fx)}°, ${fmt(fy)}°)　RMS ${alive ? fmt(1000 * Math.sqrt(r2 / alive)) : "—"}µm　存活 ${alive}`;
    const card = document.createElement("div"); card.className = "card";
    card.appendChild(title); card.appendChild(svg); grid.appendChild(card);
  }
  const legend = document.createElement("div"); legend.className = "legend";
  legend.innerHTML =
    meta.wavelengths_nm.map((w) => `<span><i style="background:${waveRGB(w)}"></i>${w}nm</span>`).join("") +
    `<span>圈 = 主光线；传感器局部坐标，各视场同量程 ±${fmt(ext * 1000)}µm</span>`;
  const wrap = document.createElement("div");
  wrap.appendChild(grid); wrap.appendChild(legend);
  $("canvas").replaceChildren(wrap);
  $("status").textContent = "";
}

$("file").addEventListener("change", (e) => e.target.files[0] && loadFile(e.target.files[0]));
$("btn-layout").addEventListener("click", () => { state.view = "layout"; show(); });
$("btn-spot").addEventListener("click", () => { state.view = "spot"; show(); });
for (const id of ["pop", "rays", "density", "sampling"]) $(id).addEventListener("change", show);
</script>
</body>
</html>
